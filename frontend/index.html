<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentForge - Multi-Agent AI System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <h1>⚡ AgentForge</h1>
            <p>Multi-Agent AI System</p>
        </div>

        <div class="status-container">
            <span id="status-dot" class="status-dot offline"></span>
            <span id="status-text">Checking API...</span>
        </div>
    </header>

    <main class="container">
        <section class="welcome-section">
            <h2>Ask AgentForge</h2>
            <p>Your intelligent multi-agent assistant for calculations, research, and web-powered answers.</p>
        </section>

        <section class="chat-container">
            <div id="chat-box" class="chat-box">
                <div class="message assistant-message">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <div class="message-name">AgentForge</div>
                        <div class="message-text">
                            Hello! 👋 I'm AgentForge.<br><br>
                            Ask me a question and I'll route it to the appropriate AI agent.
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <textarea
                    id="question"
                    placeholder="Ask AgentForge anything..."
                    rows="1"
                ></textarea>
                <button id="send-btn" type="button">Send</button>
            </div>
        </section>

        <section class="examples-section">
            <h3>Try asking:</h3>
            <div class="examples">
                <button class="example-btn" type="button" onclick="setQuestion('What is 125 * 8?')">
                    🧮 What is 125 * 8?
                </button>
                <button class="example-btn" type="button" onclick="setQuestion('What is artificial intelligence?')">
                    🤖 What is artificial intelligence?
                </button>
                <button class="example-btn" type="button" onclick="setQuestion('What are the latest developments in AI?')">
                    🔎 Latest AI developments
                </button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>AgentForge &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
